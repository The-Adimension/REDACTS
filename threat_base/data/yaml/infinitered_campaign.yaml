# INFINITERED - GTIG-attributed evidence ONLY.
#
# Every indicator in this file is published by the Google Threat Intelligence
# Group (GTIG) for the INFINITERED family / UNC6508. A hit here is family
# evidence and may be reported as conclusive.
#
# REDCap Community Forum / Vanderbilt advisory observations live in the sibling
# file redcap_forum_observations.yaml. Do NOT add non-GTIG indicators here:
# `conclusiveness: conclusive` is counted as a compromise indicator by
# static/analyze/investigator.py and drives the CRITICAL verdict.
#
# GTIG did NOT confirm the initial access vector. Nothing here should be read
# as an exploitation or entry-point indicator.

campaign:
  name: INFINITERED
  actor: UNC6508
  description: PRC-nexus intrusion set targeting US medical research institutions running
    REDCap. GTIG documented a PHP implant set - web shell, credential harvester, backdoor,
    and a dropper that re-injects itself into REDCap upgrade archives. Credentials are
    harvested from login POSTs and hidden in the legitimate redcap_sessions table. C2 is
    driven through a REDCap-TOKEN cookie gated on a magic flag. Initial access was not
    confirmed by GTIG.
  first_seen: '2023-09-01T00:00:00.000Z'
  last_seen: '2025-11-30T23:59:59.000Z'
  severity: CRITICAL
  conclusiveness: conclusive
  source_url: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research
  retrieved: '2026-07-28'
  yara_rule: G_Backdoor_INFINITERED_1
indicators:
- name: INFINITERED magic flag
  description: Backdoor command gate. GTIG YARA G_Backdoor_INFINITERED_1 $magic_flag; the
    same value is documented as the arbitrary-file-download command tag.
  pattern: '[file:content_ref.payload_bin MATCHES ''ej671a16i7fd8202nu6ltfg5p6x7u'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED magic flag (base64)
  description: Base64 form of the magic flag. GTIG YARA $magic_flag_base64.
  pattern: '[file:content_ref.payload_bin MATCHES ''ZWo2NzFhMTZpN2ZkODIwMm51Nmx0Zmc1cDZ4N3U'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED GUID marker
  description: Delimiter GUID used by the upgrade-intercept dropper. GTIG YARA $marker.
  pattern: '[file:content_ref.payload_bin MATCHES ''b49e334d-9c01-463e-9bc5-00a6920fb66e'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED GUID marker (base64)
  description: Base64 form of the delimiter GUID. GTIG YARA $marker_base64.
  pattern: '[file:content_ref.payload_bin MATCHES ''YjQ5ZTMzNGQtOWMwMS00NjNlLTliYzUtMDBhNjkyMGZiNjZl'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED cookie gate
  description: REDCAP-TOKEN cookie value sliced past the magic flag - the backdoor command
    channel. GTIG YARA $s1. The cookie name alone is NOT family evidence.
  pattern: '[file:content_ref.payload_bin MATCHES ''substr\\(\\$cookieValue, strlen\\(\\$magic_flag\\)\\);'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED credential-harvest INSERT
  description: Stolen credentials written into the legitimate redcap_sessions table.
    GTIG YARA $t2.
  pattern: '[file:content_ref.payload_bin MATCHES ''INSERT INTO redcap_sessions \\(session_id,
    session_data, session_expiration\\)'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED credential encryption
  description: Username/password joined with the [::] delimiter before encryption.
    GTIG YARA $t3.
  pattern: '[file:content_ref.payload_bin MATCHES ''encrypt\\(\\$currentUTC \\. ''''\\[::\\]''''
    \\. \\$_POST\\[''''username''''\\]'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED session prefix
  description: Harvested-credential session rows are keyed with this prefix, which lets an
    analyst find them in a redcap_sessions dump.
  pattern: '[file:content_ref.payload_bin MATCHES ''xc32038474a'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED upgrade-archive injection
  description: Dropper reads REDCap upgrade-archive members and rewrites hooks/auth/upgrade
    content so the implant survives an upgrade. GTIG YARA $u4-$u9.
  pattern: '[file:content_ref.payload_bin MATCHES ''\\$zip->getFromName\\(\\$file_(?:hooks|auth|upgrade)\\)'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED backdoor command execution
  description: shell_exec dispatch and upload handler in the backdoor body. GTIG YARA
    $s4/$s5.
  pattern: '[file:content_ref.payload_bin MATCHES ''\\$data = shell_exec\\(\\$command\\);|move_uploaded_file\\(\\$tmpPath,
    \\$fileName\\)'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
- name: INFINITERED host beacon
  description: System-information beacon fired when the backdoor receives an empty payload.
    GTIG YARA $s2.
  pattern: '[file:content_ref.payload_bin MATCHES ''getcwd\\(\\), php_uname\\(\\), phpversion\\(\\)'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: conclusive
  valid_from: '2023-09-01T00:00:00.000Z'
  references:
  - 'GTIG, retrieved 2026-07-28: https://cloud.google.com/blog/topics/threat-intelligence/prc-targets-us-medical-research'
