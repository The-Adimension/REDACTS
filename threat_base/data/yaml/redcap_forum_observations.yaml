# REDCap Community Forum / Vanderbilt advisory observations.
#
# Patterns reported by the REDCap Consortium community during the December 2025 -
# February 2026 window. These are REDCap-specific hardening and persistence
# indicators and are frequently more actionable on a live install than
# family-attributed markers.
#
# They are deliberately NOT attributed to INFINITERED: GTIG did not publish any of
# these as that family (see infinitered_campaign.yaml). Severities are unchanged
# from the original records - only the family claim and the compromise-conclusiveness
# were corrected.
#
# `conclusiveness: suspicious` here means "strong lead, needs corroboration", not
# "low severity". static/analyze/investigator.py counts only `conclusive` findings
# as compromise indicators, so a hygiene finding must not carry that value.

campaign:
  name: REDCap Community Forum observations
  description: REDCap-specific persistence, webshell and webroot-hygiene patterns reported
    by the REDCap Consortium community. Covers SQLite artefacts planted in REDCap
    directories, hook and database.php tampering, PHP auto_prepend persistence via
    .user.ini/.htaccess, upload-directory webshells, polyglots, and content-type
    masquerading.
  first_seen: '2025-12-01T00:00:00.000Z'
  last_seen: '2026-02-28T23:59:59.000Z'
  severity: CRITICAL
  conclusiveness: suspicious
  source: REDCap Community Forum / Vanderbilt advisories
indicators:
- name: redcap.db SQLite artefact
  description: SQLite database planted in REDCap directories. REDCap itself runs on MySQL,
    so a SQLite database in the tree is unexpected.
  pattern: '[file:name = ''redcap.db'' OR file:name = ''redcap_.db'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: SQLite WAL/journal sidecar
  description: SQLite write-ahead log or journal sidecar - indicates active database writes.
  pattern: '[file:name LIKE ''%-wal'' OR file:name LIKE ''%-journal'' OR file:name LIKE ''%-shm'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: hook_functions.php injection
  description: Injected functions in hook_functions.php not matching known REDCap hook names.
  pattern: '[file:name = ''hook_functions.php'' AND file:x_contains_unknown_functions = true]'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: eval/gzinflate/base64 chain
  description: eval(gzinflate(base64_decode())) payload delivery pattern. Common to many
    PHP webshell families; not specific to any one campaign.
  pattern: '[file:content_ref.payload_bin MATCHES ''eval\\s*\\(\\s*(?:gzinflate|gzuncompress)\\s*\\(\\s*base64_decode'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: database.php poisoning
  description: Extra executable code beyond the 5 standard variables in database.php.
  pattern: '[file:name = ''database.php'' AND file:x_has_forbidden_patterns = true]'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: .user.ini auto_prepend_file
  description: PHP .user.ini with auto_prepend_file - invisible persistent backdoor.
  pattern: '[file:name = ''.user.ini'' AND file:content_ref.payload_bin MATCHES ''auto_prepend_file\\s*='']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: .htaccess auto_prepend/append_file
  description: .htaccess with php_value auto_prepend_file or auto_append_file.
  pattern: '[file:name = ''.htaccess'' AND file:content_ref.payload_bin MATCHES ''php_value\\s+auto_(?:prepend|append)_file'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: PHP in upload directory
  description: PHP files in edocs/uploads/temp - webshell delivery via upload.
  pattern: '[file:parent_directory_ref.path IN (''/edocs/'', ''/uploads/'', ''/temp/'') AND file:name LIKE ''%.php'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: Polyglot file
  description: Image file containing embedded PHP code - bypasses extension filters.
  pattern: '[file:extensions[*] IN (''jpg'',''png'',''gif'') AND file:content_ref.payload_bin MATCHES ''<\\?php'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: .git directory in webroot
  description: Git repository metadata exposed in webroot.
  pattern: '[directory:path LIKE ''%/.git'']'
  pattern_type: stix
  severity: HIGH
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: Certificate/key in webroot
  description: TLS certificates or private keys stored in web-accessible directory.
  pattern: '[file:name LIKE ''%.pem'' OR file:name LIKE ''%.key'' OR file:name LIKE ''%.crt'' OR file:name LIKE ''%.p12'']'
  pattern_type: stix
  severity: HIGH
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: Composer autoload tampering
  description: Modified vendor/autoload.php - executes on every request.
  pattern: '[file:name = ''autoload.php'' AND file:parent_directory_ref.path = ''/vendor/'' AND file:hashes.SHA-256 != x_expected_hash]'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: External Module framework tampering
  description: Modified files in ExternalModules/classes/ - affects all EM execution.
  pattern: '[file:parent_directory_ref.path = ''/ExternalModules/classes/'' AND file:hashes.SHA-256 != x_expected_hash]'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: PHP content in non-PHP extension
  description: File extension does not indicate PHP but AI content-type analysis (Magika)
    identifies the content as PHP source.
  pattern: '[file:extensions[*] NOT IN (''php'',''phtml'',''phar'') AND file:x_magika_content_type = ''php'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: SQLite content in non-database extension
  description: File does not have a .db/.sqlite extension but AI content-type analysis
    identifies it as SQLite.
  pattern: '[file:extensions[*] NOT IN (''db'',''sqlite'',''sqlite3'') AND file:x_magika_content_type = ''sqlite'']'
  pattern_type: stix
  severity: CRITICAL
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: Content-type masquerading (generic)
  description: AI content-type analysis detected that a file's actual content does not
    match its extension.
  pattern: '[file:x_magika_content_type != file:x_expected_content_type]'
  pattern_type: stix
  severity: HIGH
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
- name: Polyglot file (AI-detected)
  description: Magika's deep-learning model detects content structurally different from
    what extension implies.
  pattern: '[file:x_magika_content_type IN (''php'',''javascript'',''shell'') AND file:extensions[*] IN (''jpg'',''png'',''gif'',''css'',''txt'')]'
  pattern_type: stix
  severity: HIGH
  conclusiveness: suspicious
  valid_from: '2025-12-01T00:00:00.000Z'
  references:
  - REDCap Community Forum Dec 2025-Feb 2026
